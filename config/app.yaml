app:
  name: ai-support
  version: v0.5.0

deployment:
  default_dir: /opt/crisp-ai
  bind_address: 127.0.0.1
  timezone: Europe/London

paths:
  config: config
  knowledge: knowledge
  workflows: n8n
  data: data
  logs: logs
  backups: backups

services:
  n8n:
    internal_url: http://n8n:5678
  anythingllm:
    internal_url: http://anythingllm:3001
    workspace: crisp-support
  postgres:
    internal_url: postgres://postgres:5432

webhook:
  path: /webhook/crisp-webhook
  accepted_events:
    - message:send
    - message:received
    - session:set_opened
    - session:request:initiated
  max_signature_age_seconds: 300
