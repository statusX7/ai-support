name: crisp-ai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.10-alpine}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: crisp_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: ${DEPLOY_DIR:-/opt/crisp-ai}/data/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
    logging: *default-logging

  anythingllm:
    image: ${ANYTHINGLLM_IMAGE:-mintplexlabs/anythingllm:1.16.1}
    user: "1000:1000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ANYTHINGLLM_PORT:-3001}:3001"
    environment:
      SERVER_PORT: "3001"
      STORAGE_DIR: /app/server/storage
      AUTH_TOKEN: ${ANYTHINGLLM_AUTH_TOKEN:?请在 .env 中设置 ANYTHINGLLM_AUTH_TOKEN}
      JWT_SECRET: ${ANYTHINGLLM_JWT_SECRET:?请在 .env 中设置 ANYTHINGLLM_JWT_SECRET}
      SIG_KEY: ${ANYTHINGLLM_SIG_KEY:?请在 .env 中设置 ANYTHINGLLM_SIG_KEY}
      SIG_SALT: ${ANYTHINGLLM_SIG_SALT:?请在 .env 中设置 ANYTHINGLLM_SIG_SALT}
      LLM_PROVIDER: generic-openai
      GENERIC_OPEN_AI_BASE_PATH: ${AI_API_BASE_URL:?请在 .env 中设置 AI_API_BASE_URL}
      GENERIC_OPEN_AI_API_KEY: ${AI_API_KEY:?请在 .env 中设置 AI_API_KEY}
      GENERIC_OPEN_AI_MODEL_PREF: ${AI_MODEL:?请在 .env 中设置 AI_MODEL}
      GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT: ${AI_MODEL_TOKEN_LIMIT:-8192}
      EMBEDDING_ENGINE: native
      VECTOR_DB: lancedb
      DISABLE_TELEMETRY: "true"
      DISABLE_SWAGGER_DOCS: "true"
      WORKSPACE_DELETION_PROTECTION: enable
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - type: bind
        source: ${DEPLOY_DIR:-/opt/crisp-ai}/data/anythingllm
        target: /app/server/storage
      - type: bind
        source: ${DEPLOY_DIR:-/opt/crisp-ai}/knowledge
        target: /opt/crisp-ai/knowledge
        read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3001/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - backend
    logging: *default-logging

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.33.0}
    user: "1000:1000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: crisp_ai
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_EDITOR_BASE_URL: ${PUBLIC_WEBHOOK_URL:?请在 .env 中设置 PUBLIC_WEBHOOK_URL}
      WEBHOOK_URL: ${PUBLIC_WEBHOOK_URL:?请在 .env 中设置 PUBLIC_WEBHOOK_URL}
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?请在 .env 中设置 N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto,fs
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
      TZ: ${TIMEZONE:-UTC}
      CRISP_WEBSITE_ID: ${CRISP_WEBSITE_ID:?请在 .env 中设置 CRISP_WEBSITE_ID}
      CRISP_TOKEN_TIER: ${CRISP_TOKEN_TIER:-website}
      CRISP_AUTH_B64: ${CRISP_AUTH_B64:?请在 .env 中设置 CRISP_AUTH_B64}
      CRISP_HOOK_MODE: ${CRISP_HOOK_MODE:-website}
      CRISP_WEBSITE_HOOK_SECRET: ${CRISP_WEBSITE_HOOK_SECRET:-not-configured}
      CRISP_PLUGIN_SIGNING_SECRET: ${CRISP_PLUGIN_SIGNING_SECRET:-not-configured}
      CRISP_IMAGE_HOSTS: ${CRISP_IMAGE_HOSTS:-}
      ANYTHINGLLM_API_KEY: ${ANYTHINGLLM_API_KEY:?请在 .env 中设置 ANYTHINGLLM_API_KEY}
      ANYTHINGLLM_WORKSPACE: ${ANYTHINGLLM_WORKSPACE:-crisp-support}
      ANYTHINGLLM_CHAT_MODE: ${ANYTHINGLLM_CHAT_MODE:-chat}
      AI_API_BASE_URL: ${AI_API_BASE_URL:?请在 .env 中设置 AI_API_BASE_URL}
      AI_API_KEY: ${AI_API_KEY:?请在 .env 中设置 AI_API_KEY}
      AI_MODEL: ${AI_MODEL:?请在 .env 中设置 AI_MODEL}
      AI_API_MODE: ${AI_API_MODE:-responses}
      AI_SUPPORTS_VISION: ${AI_SUPPORTS_VISION:-false}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1200}
    volumes:
      - type: bind
        source: ${DEPLOY_DIR:-/opt/crisp-ai}/data/n8n
        target: /home/node/.n8n
      - type: bind
        source: ${DEPLOY_DIR:-/opt/crisp-ai}/config
        target: /opt/crisp-ai/config
        read_only: true
      - type: bind
        source: ${DEPLOY_DIR:-/opt/crisp-ai}/knowledge
        target: /opt/crisp-ai/knowledge
        read_only: true
      - type: bind
        source: ${DEPLOY_DIR:-/opt/crisp-ai}/n8n
        target: /opt/crisp-ai/n8n
        read_only: true
      - type: bind
        source: ${DEPLOY_DIR:-/opt/crisp-ai}/data/analytics
        target: /opt/crisp-ai/data/analytics
      - type: bind
        source: ${DEPLOY_DIR:-/opt/crisp-ai}/data/runtime
        target: /opt/crisp-ai/data/runtime
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:5678/healthz').then(r =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - backend
    logging: *default-logging

networks:
  backend:
    driver: bridge
