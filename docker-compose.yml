name: crisp-ai

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: crisp_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: ${DEPLOY_DIR:-/opt/crisp-ai}/data/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: crisp_ai
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: ${PUBLIC_WEBHOOK_URL:?请在 .env 中设置 PUBLIC_WEBHOOK_URL}
      WEBHOOK_URL: ${PUBLIC_WEBHOOK_URL:?请在 .env 中设置 PUBLIC_WEBHOOK_URL}
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?请在 .env 中设置 N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - type: bind
        source: ${DEPLOY_DIR:-/opt/crisp-ai}/data/n8n
        target: /home/node/.n8n
      - type: bind
        source: ${DEPLOY_DIR:-/opt/crisp-ai}/config
        target: /opt/crisp-ai/config
        read_only: true
      - type: bind
        source: ${DEPLOY_DIR:-/opt/crisp-ai}/knowledge
        target: /opt/crisp-ai/knowledge
        read_only: true
      - type: bind
        source: ${DEPLOY_DIR:-/opt/crisp-ai}/n8n
        target: /opt/crisp-ai/n8n
        read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:5678/healthz').then(r =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - backend

networks:
  backend:
    driver: bridge
